name: OIDC Test

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  oidc-test:
    # ubuntu-24.04 fijado: `ubuntu-latest` migra a Ubuntu 26 desde el
    # 2026-10-19 (runner-images#14748) — el pin evita sorpresas de tooling.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::933629770820:role/cooppadresd-gha-backend
          aws-region: us-east-2

      - name: Verify identity
        run: |
          aws sts get-caller-identity
