name: Deploy Backend Services

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-backend-dev
  # En dev el último push manda: cancela despliegues superados en cola en vez
  # de desplegar cada commit intermedio uno tras otro.
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
      test_projects: ${{ steps.detect.outputs.test_projects }}
      migrate: ${{ steps.detect.outputs.migrate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detectar servicios afectados
        id: detect
        shell: bash
        run: |
          SERVICES=""
          # Rango del push completo (no solo el último commit): en pushes con
          # varios commits o merges, HEAD~1..HEAD invisibiliza cambios y el
          # servicio afectado jamás se despliega (incidente 2026-09-15:
          # /api/v1/health-tests/coverage-trend 404 en prod porque el endpoint
          # nuevo de la API nunca se desplegó).
          BASE="${{ github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            BASE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || git diff --name-only HEAD)

          if echo "$CHANGED" | grep -q "src/Services/CoppAddresd.Auth"; then
            SERVICES="$SERVICES auth"
          fi
          if echo "$CHANGED" | grep -q "src/CoppAddresd.Api"; then
            SERVICES="$SERVICES api"
          fi
          if echo "$CHANGED" | grep -q "src/Services/CoppAddresd.Telemedicine"; then
            SERVICES="$SERVICES telemedicine"
          fi
          if echo "$CHANGED" | grep -q "src/Services/CoppAddresd.Community"; then
            SERVICES="$SERVICES community"
          fi

          # Cambios en infraestructura compartida (Infrastructure, Application, Domain,
          # slnx, Dockerfiles, workflows) afectan a todos los servicios backend.
          SHARED=$(echo "$CHANGED" | grep -E "(src/Shared/|src/CoppAddresd\.(Infrastructure|Application|Domain)|CoppAddresd\.slnx|Dockerfile|\.github/workflows)" || true)
          if [ -n "$SHARED" ]; then
            SERVICES="auth api telemedicine community"
          fi

          if [ -z "$SERVICES" ]; then
            echo "Sin cambios backend relevantes — no se despliega nada"
            echo "services=[]" >> "$GITHUB_OUTPUT"
            echo "test_projects=[]" >> "$GITHUB_OUTPUT"
            echo "migrate=[]" >> "$GITHUB_OUTPUT"
          else
            JSON=$(echo "$SERVICES" | xargs | tr ' ' '\n' | jq -R . | jq -s -c .)
            echo "services=$JSON" >> "$GITHUB_OUTPUT"
            # Tests acotados al servicio afectado (el suite completo en cada
            # push duplicaba minutos). Compartido/api tocan el núcleo.
            TESTS=""
            if echo "$SERVICES" | grep -q -E "(^| )(api|auth)( |$)"; then
              TESTS="$TESTS tests/CoppAddresd.UnitTests"
            fi
            if [ -n "$SHARED" ]; then
              TESTS="tests/CoppAddresd.UnitTests tests/CoppAddresd.Telemedicine.UnitTests tests/CoppAddresd.Community.UnitTests"
            fi
            if echo "$SERVICES" | grep -q -E "(^| )telemedicine( |$)"; then
              TESTS="$TESTS tests/CoppAddresd.Telemedicine.UnitTests"
            fi
            if echo "$SERVICES" | grep -q -E "(^| )community( |$)"; then
              TESTS="$TESTS tests/CoppAddresd.Community.UnitTests"
            fi
            TESTS_JSON=$(echo "$TESTS" | xargs | tr ' ' '\n' | sort -u | jq -R . | jq -s -c .)
            echo "test_projects=$TESTS_JSON" >> "$GITHUB_OUTPUT"
            # Migraciones solo donde aplica (auth/community auto-migran).
            MIGRATE=$(echo "$SERVICES" | xargs | tr ' ' '\n' | grep -E "^(api|telemedicine)$" | jq -R . | jq -s -c . || true)
            echo "migrate=$MIGRATE" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: detect
    if: needs.detect.outputs.services != '' && needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.detect.outputs.test_projects) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test unitarios (${{ matrix.project }}, CI-safe, sin RDS)
        run: |
          dotnet test ${{ matrix.project }} -c Release --nologo

  deploy:
    needs: [detect, test]
    if: needs.detect.outputs.services != '' && needs.detect.outputs.services != '[]'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-2
      ECR_REGISTRY: 933629770820.dkr.ecr.us-east-2.amazonaws.com
      ECS_CLUSTER: cooppadresd-cluster
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.services) }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::933629770820:role/cooppadresd-gha-backend
          aws-region: ${{ env.AWS_REGION }}

      - name: Login ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Determinar Dockerfile y ECR por servicio
        id: svc
        shell: bash
        run: |
          case "${{ matrix.service }}" in
            auth)
              echo "dockerfile=src/Services/CoppAddresd.Auth/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "ecr=cooppadresd-auth" >> "$GITHUB_OUTPUT"
              # Email transaccional (invitaciones): SMTP M365. La contraseña vive
              # en el secret cooppadresd/smtp-password (Email__SmtpPassword).
              echo "extra_env=[{\"name\":\"Jwt__Issuer\",\"value\":\"CoppAddresd.Auth\"},{\"name\":\"Email__Provider\",\"value\":\"Smtp\"},{\"name\":\"Email__SmtpHost\",\"value\":\"smtp.office365.com\"},{\"name\":\"Email__SmtpPort\",\"value\":\"587\"},{\"name\":\"Email__SmtpUsername\",\"value\":\"info@coppadresd.com\"},{\"name\":\"Email__From\",\"value\":\"info@coppadresd.com\"},{\"name\":\"Email__FromName\",\"value\":\"CoppAddresd\"},{\"name\":\"Email__SmtpUseSsl\",\"value\":\"true\"},{\"name\":\"Email__FrontendUrl\",\"value\":\"http://cooppadresd-alb-269201785.us-east-2.elb.amazonaws.com\"}]" >> "$GITHUB_OUTPUT"
              echo "extra_secrets=[{\"name\":\"Email__SmtpPassword\",\"valueFrom\":\"arn:aws:secretsmanager:us-east-2:933629770820:secret:cooppadresd/smtp-password-XjggyI\"}]" >> "$GITHUB_OUTPUT"
              ;;
            api)
              echo "dockerfile=src/CoppAddresd.Api/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "ecr=cooppadresd-api" >> "$GITHUB_OUTPUT"
              echo "extra_env=[{\"name\":\"Jwt__Issuer\",\"value\":\"CoppAddresd.Auth\"},{\"name\":\"Storage__Provider\",\"value\":\"S3\"},{\"name\":\"Storage__S3__Region\",\"value\":\"us-east-2\"},{\"name\":\"Storage__S3__Bucket\",\"value\":\"cooppadresd-storage-prod\"},{\"name\":\"Email__Provider\",\"value\":\"Smtp\"},{\"name\":\"Email__SmtpHost\",\"value\":\"smtp.office365.com\"},{\"name\":\"Email__SmtpPort\",\"value\":\"587\"},{\"name\":\"Email__UserName\",\"value\":\"info@coppadresd.com\"},{\"name\":\"Email__FromAddress\",\"value\":\"info@coppadresd.com\"},{\"name\":\"Email__FromName\",\"value\":\"CoppAddresd\"}]" >> "$GITHUB_OUTPUT"
              echo "extra_secrets=[{\"name\":\"Storage__SignatureKey\",\"valueFrom\":\"arn:aws:secretsmanager:us-east-2:933629770820:secret:cooppadresd/storage-IdKS1X\"},{\"name\":\"Email__Password\",\"valueFrom\":\"arn:aws:secretsmanager:us-east-2:933629770820:secret:cooppadresd/smtp-password-XjggyI\"}]" >> "$GITHUB_OUTPUT"
              ;;
            telemedicine)
              echo "dockerfile=src/Services/CoppAddresd.Telemedicine/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "ecr=cooppadresd-telemedicine" >> "$GITHUB_OUTPUT"
              # AuthService__BaseUrl: validación de sesiones ERP (ErpSessionValidation); sin ella todo token ERP responde 500.
              echo "extra_env=[{\"name\":\"Jwt__Issuer\",\"value\":\"CoppAddresd.Auth\"},{\"name\":\"AuthService__BaseUrl\",\"value\":\"http://cooppadresd-alb-269201785.us-east-2.elb.amazonaws.com\"}]" >> "$GITHUB_OUTPUT"
              echo "extra_secrets=[]" >> "$GITHUB_OUTPUT"
              ;;
            community)
              echo "dockerfile=src/Services/CoppAddresd.Community/Dockerfile" >> "$GITHUB_OUTPUT"
              echo "ecr=cooppadresd-community" >> "$GITHUB_OUTPUT"
              # AuthService__BaseUrl: validación de sesiones ERP (ErpSessionValidation); sin ella todo token ERP responde 500 (dashboard ERP de comunidad roto).
              echo "extra_env=[{\"name\":\"Jwt__Issuer\",\"value\":\"CoppAddresd.Auth\"},{\"name\":\"Cors__Origins\",\"value\":\"http://cooppadresd-alb-269201785.us-east-2.elb.amazonaws.com\"},{\"name\":\"AuthService__BaseUrl\",\"value\":\"http://cooppadresd-alb-269201785.us-east-2.elb.amazonaws.com\"}]" >> "$GITHUB_OUTPUT"
              # Community firma URLs locales igual que la API: sin la clave HMAC el contenedor revienta al arrancar.
              echo "extra_secrets=[{\"name\":\"Storage__SignatureKey\",\"valueFrom\":\"arn:aws:secretsmanager:us-east-2:933629770820:secret:cooppadresd/storage-IdKS1X\"}]" >> "$GITHUB_OUTPUT"
              ;;
          esac

      # Build con caché GHA por servicio (scope): el Dockerfile separa la capa
      # de restore, así que pushes de solo-código reutilizan restore+SDK y el
      # build baja de ~8-12 min a ~1-3 min. mode=max en rama dev es aceptable.
      # push:false + docker push clasico: buildx resolviendo el tag exige
      # ecr:BatchGetImage y el rol GHA no lo tiene; el push clasico si funciona.
      - name: Build imagen (${{ github.sha }})
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ steps.svc.outputs.dockerfile }}
          push: false
          load: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ steps.svc.outputs.ecr }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ steps.svc.outputs.ecr }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Push ECR (docker push clasico)
        run: |
          docker push "${{ env.ECR_REGISTRY }}/${{ steps.svc.outputs.ecr }}:${{ github.sha }}"
          docker push "${{ env.ECR_REGISTRY }}/${{ steps.svc.outputs.ecr }}:latest"

      - name: Registrar nueva Task Definition (imagen SHA)
        id: taskdef
        shell: bash
        run: |
          TD_NAME="cooppadresd-${{ matrix.service }}"
          TASK_DEF_JSON=$(aws ecs describe-task-definition --task-definition "$TD_NAME" --region "${{ env.AWS_REGION }}" --query "taskDefinition" --output json)
          NEW_IMAGE="${{ env.ECR_REGISTRY }}/${{ steps.svc.outputs.ecr }}:${{ github.sha }}"
          NEW_TASK_DEF_JSON=$(echo "$TASK_DEF_JSON" | jq --arg img "$NEW_IMAGE" \
            --argjson envs '${{ steps.svc.outputs.extra_env }}' \
            --argjson secs '${{ steps.svc.outputs.extra_secrets }}' '
            .containerDefinitions[0].image = $img |
            del(.status, .compatibilities, .taskDefinitionArn, .revision, .registeredAt, .registeredBy, .requiresAttributes) |
            .containerDefinitions[0].environment =
              ((.containerDefinitions[0].environment // []) as $cur |
               [$cur[] | select(. as $e | ([$envs[].name] | index($e.name)) | not)] + $envs) |
            .containerDefinitions[0].secrets =
              ((.containerDefinitions[0].secrets // []) as $cur |
               [$cur[] | select(. as $e | ([$secs[].name] | index($e.name)) | not)] + $secs)
          ')
          REGISTERED=$(aws ecs register-task-definition --cli-input-json "$NEW_TASK_DEF_JSON" --region "${{ env.AWS_REGION }}")
          echo "arn=$(echo "$REGISTERED" | jq -r '.taskDefinition.taskDefinitionArn')" >> "$GITHUB_OUTPUT"
          echo "rev=$(echo "$REGISTERED" | jq -r '.taskDefinition.revision')" >> "$GITHUB_OUTPUT"

      - name: Actualizar ECS Service
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "cooppadresd-${{ matrix.service }}" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Esperar rollout COMPLETED (polling 15s)
        timeout-minutes: 20
        shell: bash
        run: |
          SERVICE="cooppadresd-${{ matrix.service }}"
          TD_ARN="${{ steps.taskdef.outputs.arn }}"
          DEADLINE=$((SECONDS + 1200))
          MISS_COUNT=0

          while true; do
            DEP=$(aws ecs describe-services \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --services "$SERVICE" \
              --region "${{ env.AWS_REGION }}" \
              --query "services[0].deployments[?taskDefinition=='$TD_ARN'] | [0]" \
              --output json)

            STATE=$(echo "$DEP" | jq -r '.rolloutState // "MISSING"')
            RUNNING=$(echo "$DEP" | jq -r '.runningCount // "?"')
            DESIRED=$(echo "$DEP" | jq -r '.desiredCount // "?"')

            echo "[$(date -u +%H:%M:%S)] rollout=$STATE running=$RUNNING desired=$DESIRED"

            if [ "$STATE" = "COMPLETED" ] && [ "$RUNNING" = "$DESIRED" ]; then
              echo "Deployment estable: rollout=$STATE running=$RUNNING desired=$DESIRED"
              exit 0
            fi

            if [ "$STATE" = "FAILED" ]; then
              echo "::error::Rollout FAILED: el deployment de $SERVICE no pudo completarse"
              exit 1
            fi

            if [ "$STATE" = "MISSING" ]; then
              # Los primeros polls pueden no ver el deployment aún; solo es rollback tras racha.
              MISS_COUNT=$((MISS_COUNT + 1))
              if [ "$MISS_COUNT" -lt 8 ]; then
                sleep 15
                continue
              fi
              # El deployment nuevo desapareció: circuit breaker hizo rollback a otra revisión.
              # Fallar rápido con el estado real en vez de pollear 20 min en vacío.
              OTHER=$(aws ecs describe-services \
                --cluster "${{ env.ECS_CLUSTER }}" \
                --services "$SERVICE" \
                --region "${{ env.AWS_REGION }}" \
                --query "services[0].deployments[?taskDefinition!=`$TD_ARN`].[taskDefinition,rolloutState] | [0]" \
                --output text)
              echo "::error::Deployment retirado (rollback?) de $SERVICE. Otra revisión activa: $OTHER. Revisar stoppedReason de las tasks nuevas."
              exit 1
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timeout 20 min: rollout=$STATE running=$RUNNING desired=$DESIRED"
              exit 1
            fi

            sleep 15
          done

      - name: Diagnóstico en fallo
        if: failure()
        shell: bash
        run: |
          TASKS=$(aws ecs list-tasks \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service-name "cooppadresd-${{ matrix.service }}" \
            --region "${{ env.AWS_REGION }}" --query "taskArns" --output text)
          TASKS_STOPPED=$(aws ecs list-tasks \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service-name "cooppadresd-${{ matrix.service }}" \
            --desired-status STOPPED \
            --region "${{ env.AWS_REGION }}" --query "taskArns[0:2]" --output text)
          TASKS="$TASKS $TASKS_STOPPED"
          for T in $TASKS; do
            aws ecs describe-tasks \
              --cluster "${{ env.ECS_CLUSTER }}" \
              --tasks "$T" --region "${{ env.AWS_REGION }}" \
              --query "tasks[0].{Status:lastStatus,Stop:stoppedReason,Containers:containers[*].{Name:name,Exit:exitCode,Reason:reason}}" \
              --output json
          done
          # re-register

  migrate:
    needs: [detect, deploy]
    # always(): un fallo en el deploy de OTRO servicio (p. ej. community) no debe
    # saltarse las migraciones pendientes de api/telemedicine. El cuerpo del job
    # resuelve el task def por nombre y es idempotente (EF omite lo ya aplicado).
    if: >
      always() &&
      needs.detect.outputs.migrate != '' &&
      needs.detect.outputs.migrate != '[]'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-2
      ECS_CLUSTER: cooppadresd-cluster
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect.outputs.migrate) }}
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::933629770820:role/cooppadresd-gha-backend
          aws-region: ${{ env.AWS_REGION }}

      # Cada microservicio tiene su PROPIO historial de migraciones en su schema
      # (api → public.__EFMigrationsHistory, telemedicine → tele.__ef_migrations_history);
      # el runner de CI no alcanza el RDS (subred privada), así que la migración
      # corre como one-off task Fargate DENTRO de la VPC, con el task def del
      # servicio recién registrado (imagen nueva con la migración embebida) y el
      # entrypoint en modo --migrate (ver Program.cs de cada servicio). La conexión
      # sale de las env vars del task def (ConnectionStrings__DefaultConnection).
      # Idempotente: EF omite las migraciones ya aplicadas.
      # Auth y Community auto-migran al arrancar (MigrateAsync en su Program.cs):
      # no necesitan paso en el pipeline.
      # REQUISITO IAM en el role cooppadresd-gha-backend: ecs:RunTask,
      # ecs:DescribeTasks, iam:PassRole (task/execution roles del task def) y
      # logs:GetLogEvents (opcional, tail de logs en fallo). AccessDenied en
      # RunTask = falta el permiso en el role, no un error del flujo.
      - name: Aplicar migraciones (${{ matrix.service }}, one-off task ECS)
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          # La matriz ya viene filtrada a api|telemedicine (auth/community
          # auto-migran al arrancar, ver comentario del job).
          TD_NAME="cooppadresd-${{ matrix.service }}"
          TD_ARN=$(aws ecs describe-task-definition \
            --task-definition "$TD_NAME" --region "$AWS_REGION" \
            --query "taskDefinition.taskDefinitionArn" --output text)
          CONTAINER=$(aws ecs describe-task-definition \
            --task-definition "$TD_NAME" --region "$AWS_REGION" \
            --query "taskDefinition.containerDefinitions[0].name" --output text)
          NET_CFG=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" --services "$TD_NAME" --region "$AWS_REGION" \
            --query "services[0].networkConfiguration" --output json)

          TASK=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$TD_ARN" \
            --region "$AWS_REGION" \
            --launch-type FARGATE \
            --network-configuration "$NET_CFG" \
            --overrides "{\"containerOverrides\":[{\"name\":\"$CONTAINER\",\"command\":[\"--migrate\"]}]}" \
            --query "tasks[0].taskArn" --output text)
          echo "Task de migración (${{ matrix.service }}): $TASK"

          DEADLINE=$((SECONDS + 1200))
          while true; do
            STATE=$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" --tasks "$TASK" --region "$AWS_REGION" \
              --query "tasks[0].lastStatus" --output text)
            EXIT=$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" --tasks "$TASK" --region "$AWS_REGION" \
              --query "tasks[0].containers[0].exitCode" --output text)
            echo "[$(date -u +%H:%M:%S)] task=$STATE exit=$EXIT"

            if [ "$STATE" = "STOPPED" ]; then
              if [ "$EXIT" = "0" ]; then
                echo "Migraciones de ${{ matrix.service }} aplicadas correctamente"
                exit 0
              fi
              echo "::error::La migración de ${{ matrix.service }} falló (exit=$EXIT)"
              LOG_GROUP=$(aws ecs describe-task-definition \
                --task-definition "$TD_NAME" --region "$AWS_REGION" \
                --query "taskDefinition.containerDefinitions[0].logConfiguration.options[\"awslogs-group\"]" \
                --output text 2>/dev/null || true)
              if [ -n "$LOG_GROUP" ] && [ "$LOG_GROUP" != "None" ]; then
                PREFIX=$(aws ecs describe-task-definition \
                  --task-definition "$TD_NAME" --region "$AWS_REGION" \
                  --query "taskDefinition.containerDefinitions[0].logConfiguration.options[\"awslogs-stream-prefix\"]" \
                  --output text 2>/dev/null || true)
                TASK_ID=$(basename "$TASK")
                aws logs get-log-events \
                  --log-group-name "$LOG_GROUP" \
                  --log-stream-name "$PREFIX/$CONTAINER/$TASK_ID" \
                  --region "$AWS_REGION" --query "events[*].message" --output text \
                  2>/dev/null | tail -40 || true
              fi
              exit 1
            fi

            if [ "$SECONDS" -ge "$DEADLINE" ]; then
              echo "::error::Timeout 20 min esperando la migración de ${{ matrix.service }} (task=$STATE)"
              exit 1
            fi
            sleep 10
          done
