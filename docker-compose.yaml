services:
  postgres:
    image: postgres:18-alpine
    container_name: coppAddresd
    environment:
      POSTGRES_DB: coppaddresd
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: "CoppAddresdDev!2026"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d coppaddresd"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
