services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: coppAddresd
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: "CoppAddresdDev!2026"
      POSTGRES_DB: coppaddresd
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d coppaddresd"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway (YARP) — única entrada pública para clientes (web/móvil/webhooks).
  # Enrutamiento declarativo en appsettings del gateway (ver docs/architecture/gateway.md).
  # Notas:
  #  - El Dockerfile expone 5080 (ASPNETCORE_URLS=http://+:5080) e incluye curl en la
  #    imagen runtime (mcr.microsoft.com/dotnet/aspnet no trae curl) para el healthcheck.
  #  - REGLA DE RED: dentro de la red de compose los clusters del gateway apuntan a los
  #    NOMBRES DE SERVICIO (auth/api/telemedicine) y al puerto interno 8080 (los Dockerfiles
  #    existentes usan :8080). Eso se configura en appsettings.Docker.json, que se carga
  #    porque ASPNETCORE_ENVIRONMENT=Docker. En desarrollo local (fuera de Docker) los
  #    clusters apuntan a localhost:5122/5123/5130 (appsettings.json / appsettings.Development.json).
  #  - El context del build es la raíz del repo porque el Dockerfile del gateway (al igual que
  #    Auth/Api/Telemedicine) usa `COPY . .` y restaura src/Services/CoppAddresd.Gateway.
  gateway:
    build:
      context: .
      dockerfile: src/Services/CoppAddresd.Gateway/Dockerfile
    container_name: coppAddresdGateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      # Clave interna compartida con los backends (dev). En producción salir de Secrets Manager.
      - InternalKey__Key=dev-internal-key-change-me
    ports:
      - "5080:5080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Caché distribuida (Valkey) — AUTH local del compose (docs/modules/cache/README.md).
  #  - Los 3 servicios .NET se conectan a 127.0.0.1:6379 con Cache:Provider=Valkey (fail-open:
  #    si Valkey cae, degradan a PostgreSQL y la request sigue correcta, /health Degraded).
  #  - Contraseña configurable con VALKEY_PASSWORD (default CoppAddresdValkey2026, la misma
  #    que usan los ConnectionStrings:Valkey de los appsettings.Development.json).
  #  - TTL-based eviction + AOF (arranque tibio tras reinicio). Los datos del caché viven
  #    en volumen aparte y se pueden recrear sin riesgo — NUNCA tocar el volumen pgdata.
  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: coppAddresd-valkey
    environment:
      - VALKEY_PASSWORD=${VALKEY_PASSWORD:-CoppAddresdValkey2026}
    command:
      [
        "valkey-server",
        "--requirepass",
        "${VALKEY_PASSWORD:-CoppAddresdValkey2026}",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "volatile-lru",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  # Nombre pinnado para reutilizar el volumen existente del caché (no recrear).
  valkeydata:
    name: coppaddresd-valkeydata